[project]
name = "msbook"
version = "0.1.0"
description = "Local helper modules for the notebooks in 'Marketing Science in Python: A Practitioner's Guide' (not published to PyPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jimmy Hajime Takeda" },
]
# Runtime dependencies are managed via environment.yml (conda).
# This package itself is import-only; we do not add deps here to avoid
# duplicating / conflicting with the conda env.
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── Test suite (author-internal QA; see doc/claude_code/notebook-test-strategy-2026-06-10.md)
# Default `pytest` from the repo root runs everything under notebooks/.
# Layered selection happens via markers + the Makefile targets, e.g.:
#   pytest -m "not data and not artifact and not heavy and not exec and not net"
[tool.pytest.ini_options]
testpaths = ["notebooks"]
markers = [
    "data: needs raw datasets under data/raw/ (auto-skips when absent)",
    "artifact: needs locally generated notebook outputs (artifacts/, output/figures)",
    "heavy: long-running (>60s): model fitting, MCMC, full refits",
    "exec: full notebook execution (jupytext --execute)",
    "net: needs network access",
]
