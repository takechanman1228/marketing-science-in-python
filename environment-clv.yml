name: marketing-science-clv
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - jupyter>=1.0
      - ipykernel>=7.0
      # Pinned so that regenerating a paired notebook does not produce drift
      # that is only a jupytext version difference.
      - jupytext==1.19.1
      # Declare transitive runtime dependencies explicitly so the dedicated
      # environment also works when Python user-site packages are disabled.
      - rich>=13.7
      - mdit-py-plugins>=0.4
      # PyMC-Marketing 1.0 requires ArviZ >=1.2, while Part 6 Meridian in
      # environment.yml pins ArviZ <0.20. Keep the independent PyMC and
      # TensorFlow/Meridian modeling stacks in separate environments.
      - pymc-marketing==1.0.0
      - "arviz>=1.2,<2"
      - "arviz-plots[matplotlib]>=1.2"
      - xarray>=2024.0
      - numpy>=2.0
      - pandas>=2.0
      - "matplotlib>=3.8,<3.11"
      - scipy>=1.14
      - openpyxl>=3.1
      - kagglehub>=0.3
      - pytest>=8.0
